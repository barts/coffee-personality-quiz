<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style 3: Bold & Dramatic</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Space Grotesk', sans-serif;
    background: #0A0A0A;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #141414;
    border: 1px solid #2A2A2A;
    border-radius: 12px;
    padding: 48px 40px;
    max-width: 520px;
    width: 100%;
  }
  .label {
    display: inline-block;
    color: #E8AA3C;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 32px;
    font-weight: 700;
    color: #FFFFFF;
    margin-bottom: 8px;
    letter-spacing: -1px;
    line-height: 1.1;
  }
  .subtitle {
    color: #666;
    font-size: 14px;
    margin-bottom: 36px;
  }
  .question {
    font-size: 18px;
    font-weight: 500;
    color: #DDD;
    margin-bottom: 24px;
  }
  .option {
    display: block;
    width: 100%;
    padding: 16px 20px;
    margin-bottom: 10px;
    border: 1px solid #2A2A2A;
    border-radius: 8px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 400;
    color: #999;
    background: #1A1A1A;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
  }
  .option:hover {
    border-color: #E8AA3C;
    color: #FFF;
    background: #1E1A14;
  }
  .progress-bar {
    margin-top: 32px;
    height: 2px;
    background: #2A2A2A;
    border-radius: 1px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 16.6%;
    background: #E8AA3C;
    border-radius: 1px;
  }
  .style-tag {
    text-align: center;
    margin-top: 24px;
    font-size: 13px;
    color: #444;
  }
</style>
</head>
<body>
<div class="card">
  <span class="label">Style 3: Bold & Dramatic</span>
  <h1>What's Your Coffee Personality?</h1>
  <p class="subtitle">Answer 6 questions. Discover your brew.</p>
  <p class="question">Pick your ideal Saturday morning:</p>
  <button class="option">Up early, chasing adventure</button>
  <button class="option">Slow start with a good book</button>
  <button class="option">Yoga, smoothie, zen vibes</button>
  <button class="option">Saturday morning? I'm still up from Friday</button>
  <button class="option">Farmers market for artisan beans</button>
  <div class="progress-bar"><div class="progress-fill"></div></div>
</div>
</body>
</html>
