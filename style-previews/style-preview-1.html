<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style 1: Playful & Colorful</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #FF6B6B, #FFE66D, #4ECDC4);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 24px;
    padding: 48px 40px;
    max-width: 520px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  .label {
    display: inline-block;
    background: #FFE66D;
    color: #333;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    padding: 6px 14px;
    border-radius: 20px;
    margin-bottom: 20px;
  }
  h1 {
    font-family: 'Fredoka One', cursive;
    font-size: 28px;
    color: #333;
    margin-bottom: 8px;
  }
  .subtitle {
    color: #888;
    font-size: 14px;
    margin-bottom: 32px;
  }
  .question {
    font-size: 20px;
    font-weight: 700;
    color: #333;
    margin-bottom: 24px;
  }
  .option {
    display: block;
    width: 100%;
    padding: 16px 20px;
    margin-bottom: 12px;
    border: 2px solid #eee;
    border-radius: 16px;
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: #555;
    background: white;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
  }
  .option:hover {
    border-color: #4ECDC4;
    background: #F0FFFE;
    color: #333;
    transform: translateY(-2px);
  }
  .progress {
    display: flex;
    gap: 6px;
    margin-top: 32px;
  }
  .dot {
    height: 6px;
    flex: 1;
    border-radius: 3px;
    background: #eee;
  }
  .dot.active { background: #4ECDC4; }
  .style-tag {
    text-align: center;
    margin-top: 24px;
    font-size: 13px;
    color: #aaa;
  }
</style>
</head>
<body>
<div class="card">
  <span class="label">Style 1: Playful & Colorful</span>
  <h1>What's Your Coffee Personality?</h1>
  <p class="subtitle">Answer 6 quick questions to find your perfect brew</p>
  <p class="question">Pick your ideal Saturday morning:</p>
  <button class="option">🌅 Up early, chasing adventure</button>
  <button class="option">📖 Slow start with a good book</button>
  <button class="option">🧘 Yoga, smoothie, zen vibes</button>
  <button class="option">🌙 Saturday morning? I'm still up from Friday</button>
  <button class="option">☕ Farmers market for artisan beans</button>
  <div class="progress">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>
</body>
</html>
